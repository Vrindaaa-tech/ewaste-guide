<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>E-Waste Guide</title>
<style>
:root{--bg:#f1f6f3;--card:#fff;--ink:#12302b;--mute:#4e6761;--line:#d3e0da;--acc:#17784f;--accx:#fff;--soft:#dff0e7;--h1:#2f9e66;--h2:#d9921a;--h3:#c4372d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0e1a17;--card:#162622;--ink:#e3f1ec;--mute:#9bb5ad;--line:#274039;--acc:#4cc58b;--accx:#0e1a17;--soft:#1d3a31;--h1:#4cc58b;--h2:#efb040;--h3:#ee6a5f}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0e1a17;--card:#162622;--ink:#e3f1ec;--mute:#9bb5ad;--line:#274039;--acc:#4cc58b;--accx:#0e1a17;--soft:#1d3a31;--h1:#4cc58b;--h2:#efb040;--h3:#ee6a5f}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Segoe UI",system-ui,-apple-system,"Noto Sans Devanagari",sans-serif}
h1,h2,h3{line-height:1.15;margin:0 0 .5em;letter-spacing:-.01em}
h1{font-size:clamp(2rem,6vw,3.4rem);font-weight:800}h2{font-size:1.6rem}h3{font-size:1.1rem}
p{margin:0 0 .8em;max-width:68ch}
a{color:var(--acc)}
:focus-visible{outline:3px solid var(--h2);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:2px solid var(--ink)}
.bar{max-width:1060px;margin:auto;padding:.6rem 1rem;display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.logo{font-weight:800;font-size:1.15rem;margin-right:auto;text-decoration:none;color:var(--ink)}
nav{display:flex;gap:.25rem;flex-wrap:wrap}
nav a{padding:.4rem .7rem;border-radius:6px;text-decoration:none;color:var(--ink);font-weight:600;font-size:.95rem}
nav a[aria-current=page]{background:var(--ink);color:var(--bg)}
button,.btn{font:inherit;font-weight:700;border:2px solid var(--ink);background:var(--card);color:var(--ink);padding:.45rem .9rem;border-radius:8px;cursor:pointer}
button.p{background:var(--acc);color:var(--accx);border-color:var(--acc)}
button.s{padding:.25rem .6rem;font-size:.85rem}
main{max-width:1060px;margin:auto;padding:1.5rem 1rem 3rem}
.hero{display:grid;gap:1.5rem;grid-template-columns:1.2fr 1fr;align-items:center;padding:1rem 0 2rem}
@media(max-width:760px){.hero{grid-template-columns:1fr}}
.sf{display:flex;gap:.5rem;margin:1rem 0 .6rem}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:8px;padding:.55rem .7rem;width:100%}
.sf input{flex:1;border-color:var(--ink)}
label{display:block;font-weight:600;margin:.7rem 0 .25rem}
.chips{display:flex;gap:.4rem;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:.2rem .75rem;font-size:.9rem;cursor:pointer;font-weight:600}
.scale{background:var(--card);border:2px solid var(--ink);border-radius:12px;padding:1rem}
.scale h3{margin-bottom:.7rem}
.row{display:flex;align-items:center;gap:.6rem;padding:.4rem 0;border-top:1px solid var(--line)}
.dot{width:14px;height:14px;border-radius:50%;flex:none}
.grid{display:grid;gap:.8rem;grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.item{text-align:left;display:flex;flex-direction:column;gap:.2rem;padding:.9rem;border:2px solid var(--line);border-radius:12px;background:var(--card);font-weight:600;cursor:pointer}
.item.sel{border-color:var(--ink)}
.item .em{font-size:2.2rem;line-height:1}
.tag{font-size:.8rem;font-weight:700;display:inline-flex;gap:.35rem;align-items:center}
.panel{background:var(--card);border:2px solid var(--ink);border-radius:12px;padding:1.2rem;margin:1.2rem 0}
.cols{display:grid;gap:1rem;grid-template-columns:1fr 1fr}
@media(max-width:760px){.cols{grid-template-columns:1fr}}
.tabs{display:flex;gap:.4rem;margin:1rem 0;flex-wrap:wrap}
.tabs button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
ol.st{padding-left:1.2rem}
.tbl{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:.5rem;border-bottom:1px solid var(--line);font-size:.95rem}
.st-badge{padding:.1rem .6rem;border-radius:99px;font-size:.8rem;font-weight:700;background:var(--soft)}
.bars{display:grid;gap:.5rem}.bar-r{display:grid;grid-template-columns:130px 1fr 30px;gap:.5rem;align-items:center;font-size:.9rem}
.bar-t{height:14px;background:var(--soft);border-radius:7px;overflow:hidden}.bar-t i{display:block;height:100%;background:var(--acc)}
.stats{display:grid;gap:.8rem;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));margin-bottom:1rem}
.stat{border:2px solid var(--line);border-radius:12px;padding:.8rem;background:var(--card)}.stat b{font-size:2rem;display:block;line-height:1}
details{border-bottom:1px solid var(--line);padding:.7rem 0}summary{font-weight:700;cursor:pointer}
dialog{border:2px solid var(--ink);border-radius:12px;background:var(--card);color:var(--ink);max-width:380px;width:92%}
dialog::backdrop{background:#0008}
.toast{position:fixed;left:50%;bottom:calc(1rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.6rem 1.1rem;border-radius:8px;font-weight:600;z-index:9}
.mute{color:var(--mute)}.empty{padding:1rem;border:2px dashed var(--line);border-radius:12px;color:var(--mute)}
footer{border-top:2px solid var(--ink);padding:1rem;text-align:center;color:var(--mute);font-size:.9rem}
.view{display:none}.view.on{display:block}
img.pv{max-width:140px;border-radius:8px;border:2px solid var(--line)}
@media(prefers-reduced-motion:no-preference){.view.on{animation:f .25s}@keyframes f{from{opacity:.3}}}
</style>
</head>
<body>
<header><div class="bar">
<a class="logo" href="#home">♻️ <span data-t="brand"></span></a>
<nav aria-label="Main">
<a href="#home" data-t="nHome"></a><a href="#identify" data-t="nId"></a><a href="#pickup" data-t="nPick"></a><a href="#society" data-t="nSoc"></a><a href="#learn" data-t="nLearn"></a></nav>
<button class="s" id="lang" aria-label="Language">हिन्दी</button>
<button class="s p" id="acct"></button>
</div></header>

<main>
<section class="view" id="v-home">
<div class="hero"><div>
<h1 data-t="hero"></h1>
<p class="mute" data-t="heroSub"></p>
<form class="sf" id="homeSearch"><input id="hq" aria-label="Search" data-ph="ph"><button class="p" data-t="search"></button></form>
<div class="chips" id="quick"></div></div>
<div class="scale"><h3 data-t="scale"></h3>
<div class="row"><span class="dot" style="background:var(--h1)"></span><b data-t="low"></b><span class="mute" data-t="lowD"></span></div>
<div class="row"><span class="dot" style="background:var(--h2)"></span><b data-t="med"></b><span class="mute" data-t="medD"></span></div>
<div class="row"><span class="dot" style="background:var(--h3)"></span><b data-t="high"></b><span class="mute" data-t="highD"></span></div></div></div>
<h2 data-t="cats"></h2><div class="grid" id="homeGrid"></div>
</section>

<section class="view" id="v-identify">
<h2 data-t="nId"></h2>
<div class="cols"><div><label for="q" data-t="byName"></label><input id="q" data-ph="ph" autocomplete="off"></div>
<div><label for="photo" data-t="byPhoto"></label><input type="file" id="photo" accept="image/*"><div id="pvBox"></div></div></div>
<div class="grid" id="grid" style="margin-top:1rem"></div>
<div id="detail"></div>
</section>

<section class="view" id="v-pickup">
<h2 data-t="nPick"></h2>
<div class="tabs" role="group"><button data-tab="dep" aria-pressed="true" data-t="tDep"></button><button data-tab="req" aria-pressed="false" data-t="tReq"></button><button data-tab="kab" aria-pressed="false" data-t="tKab"></button></div>
<div id="tab-dep"><div class="cols"><form class="panel" id="depForm"><h3 data-t="tDep"></h3>
<label data-t="item"></label><select name="item" class="itemSel"></select>
<label data-t="qty"></label><input name="qty" type="number" min="1" value="1" required>
<p style="margin-top:1rem"><button class="p" data-t="save"></button></p></form>
<div class="panel"><h3 data-t="myDep"></h3><div id="depList"></div></div></div></div>
<div id="tab-req" hidden><div class="cols"><form class="panel" id="reqForm"><h3 data-t="tReq"></h3>
<label data-t="item"></label><select name="item" class="itemSel"></select>
<label data-t="qty"></label><input name="qty" type="number" min="1" value="1" required>
<label data-t="addr"></label><input name="addr" required>
<label data-t="date"></label><input name="date" type="date" required>
<p style="margin-top:1rem"><button class="p" data-t="send"></button></p></form>
<div class="panel"><h3 data-t="myReq"></h3><div id="reqList"></div></div></div></div>
<div id="tab-kab" hidden><div class="panel"><h3 data-t="tKab"></h3><p class="mute" data-t="kabD"></p><div id="kabList"></div></div></div>
</section>

<section class="view" id="v-society">
<h2 data-t="nSoc"></h2>
<div class="stats" id="stats"></div>
<div class="cols"><form class="panel" id="socForm"><h3 data-t="regSoc"></h3>
<label data-t="sName"></label><input name="name" required>
<label data-t="sLoc"></label><input name="loc" required>
<label data-t="sBox"></label><input name="box" required>
<p style="margin-top:1rem"><button class="p" data-t="save"></button></p><div id="socInfo"></div></form>
<div class="panel"><h3 data-t="dash"></h3><div class="bars" id="bars"></div></div></div>
</section>

<section class="view" id="v-learn">
<h2 data-t="tips"></h2><div class="grid" id="tipGrid"></div>
<div class="cols" style="margin-top:1.5rem"><div><h2 data-t="faq"></h2><div id="faqList"></div></div>
<form class="panel" id="fbForm"><h3 data-t="fb"></h3><label data-t="fbMsg"></label><textarea name="m" rows="4" required></textarea>
<p style="margin-top:1rem"><button class="p" data-t="send"></button></p></form></div>
</section>
</main>
<footer data-t="foot"></footer>

<dialog id="dlg"><form method="dialog" id="authForm"><h3 id="dTitle"></h3>
<label data-t="name"></label><input name="name" required>
<label data-t="role"></label><select name="role"><option value="resident">Resident</option><option value="admin">Society admin</option><option value="kabadiwala">Kabadiwala</option></select>
<label data-t="pass"></label><input name="pass" type="password" required minlength="6" autocomplete="current-password">
<p style="margin-top:1rem;display:flex;gap:.5rem"><button class="p" data-t="go"></button><button type="button" id="dx" data-t="cancel"></button></p></form></dialog>

const hc=h=>`var(--h${h})`;
function toast(m){const d=document.createElement("div");d.className="toast";d.setAttribute("role","status");d.textContent=m;document.body.append(d);setTimeout(()=>d.remove(),2200)}
function applyLang(){document.documentElement.lang=S.lang;$$("[data-t]").forEach(e=>e.textContent=t(e.dataset.t));$$("[data-ph]").forEach(e=>e.placeholder=t(e.dataset.ph));$("#lang").textContent=S.lang==="en"?"हिन्दी":"English";$("#acct").textContent=S.user?`${S.user.name} · ${t("logout")}`:t("login");$$(".itemSel").forEach(s=>{const v=s.value;s.innerHTML=ITEMS.map(i=>`<option value="${i.id}">${i.e} ${esc(i.n[L()])}</option>`).join("");if(v)s.value=v});renderAll()}
function card(i){return `<button class="item" data-id="${i.id}"><span class="em">${i.e}</span>${esc(i.n[L()])}<span class="tag"><span class="dot" style="background:${hc(i.h)}"></span>${hz(i.h)}</span></button>`}
function match(q){q=q.trim().toLowerCase();return q?ITEMS.filter(i=>(i.k+" "+i.n.join(" ").toLowerCase()).includes(q)||q.split(/\s+/).some(w=>w.length>2&&i.k.includes(w))):ITEMS}
function renderGrid(list,msg){const g=$("#grid");g.innerHTML=list.length?list.map(card).join(""):`<div class="empty">${t("none")}</div>`}
function showDetail(id){const i=ITEMS.find(x=>x.id===id);if(!i)return;$$("#grid .item").forEach(b=>b.classList.toggle("sel",b.dataset.id===id));$("#detail").innerHTML=`<div class="panel"><h2>${i.e} ${esc(i.n[L()])}</h2><p class="tag" style="font-size:1rem"><span class="dot" style="background:${hc(i.h)}"></span>${t("hazard")}: ${hz(i.h)}</p><div class="cols"><div><h3>${t("how")}</h3><ol class="st">${i.s.map(x=>`<li>${esc(x)}</li>`).join("")}</ol></div><div><h3>${t("where")}</h3><p>${esc(i.w)}</p><a class="btn" href="#pickup" style="text-decoration:none;display:inline-block">${t("tReq")}</a></div></div></div>`;$("#detail").scrollIntoView({behavior:"smooth",block:"nearest"})}
const iname=id=>{const i=ITEMS.find(x=>x.id===id);return i?`${i.e} ${i.n[L()]}`:id};
function list(rows,empty){return rows.length?`<div class="tbl"><table>${rows.join("")}</table></div>`:`<div class="empty">${empty}</div>`}
function renderLists(){
$("#depList").innerHTML=list(S.deps.map(d=>`<tr><td>${esc(iname(d.item))}</td><td>×${d.qty}</td><td class="mute">${esc(new Date(d.on).toLocaleDateString())}</td></tr>`),t("noDep"));
$("#reqList").innerHTML=list(S.reqs.map(r=>`<tr><td>${esc(iname(r.item))} ×${r.qty}</td><td>${esc(r.date)}</td><td><span class="st-badge">${r.done?t("done"):t("pending")}</span></td></tr>`),t("noReq"));
const isKab=S.user&&S.user.role==="kabadiwala";
$("#kabList").innerHTML=isKab?list(S.all.map(r=>`<tr><td>${esc(iname(r.item))} ×${r.qty}<br><span class="mute">${esc(r.by)} · ${esc(r.addr)}</span></td><td>${esc(r.date)}</td><td>${r.done?`<span class="st-badge">${t("done")}</span>`:`<button class="s" data-col="${r.id}">${t("collect")}</button>`}</td></tr>`),t("noReq")):`<div class="empty">${t("kabLogin")}</div>`;
const st=S.stats;
$("#stats").innerHTML=[[st.items,"total"],[st.done,"pickups"],[st.open,"open"],[S.deps.length*10,"pts"]].map(([v,k])=>`<div class="stat"><b>${v}</b>${t(k)}</div>`).join("");
const by=st.byItem||{},mx=Math.max(1,...Object.values(by));
$("#bars").innerHTML=Object.keys(by).length?ITEMS.filter(i=>by[i.id]).map(i=>`<div class="bar-r"><span>${i.e} ${esc(i.n[L()])}</span><div class="bar-t"><i style="width:${by[i.id]/mx*100}%"></i></div><b>${by[i.id]}</b></div>`).join(""):`<div class="empty">${t("noDep")}</div>`;
$("#socInfo").innerHTML=S.soc?`<p class="panel" style="margin-top:1rem"><b>${t("soc")}:</b> ${esc(S.soc.name)}, ${esc(S.soc.loc)}<br>📦 ${esc(S.soc.box)}</p>`:"";}
async function collect(id){try{await api("/requests/"+id+"/collect",{});await refresh();toast(t("done"))}catch(x){fail(x)}}
function renderAll(){const q=$("#q").value;renderGrid(match(q));$("#homeGrid").innerHTML=ITEMS.map(card).join("");$("#quick").innerHTML=["charger","phone","battery","bulb"].map(w=>`<button class="chip" data-q="${w}">${w}</button>`).join("");$("#tipGrid").innerHTML=TIPS.map(x=>`<div class="stat"><h3>${x[0]}</h3><p class="mute">${x[1]}</p></div>`).join("");$("#faqList").innerHTML=FAQ.map(x=>`<details><summary>${x[0]}</summary><p>${x[1]}</p></details>`).join("");renderLists()}
function route(){const v=(location.hash||"#home").slice(1);const id=$("#v-"+v)?v:"home";$$(".view").forEach(e=>e.classList.toggle("on",e.id==="v-"+id));$$("nav a").forEach(a=>a.toggleAttribute("aria-current",a.getAttribute("href")==="#"+id)&&a.setAttribute("aria-current","page"));$$("nav a").forEach(a=>{if(a.getAttribute("href")!=="#"+id)a.removeAttribute("aria-current")});scrollTo(0,0)}
function need(){if(S.user)return true;toast(t("loginFirst"));openAuth();return false}
function openAuth(){$("#dTitle").textContent=t("login");$("#dlg").showModal()}
document.addEventListener("click",e=>{
const it=e.target.closest(".item");if(it){if(it.closest("#homeGrid")){location.hash="#identify";}showDetail(it.dataset.id);return}
const ch=e.target.closest(".chip");if(ch){$("#q").value=ch.dataset.q;location.hash="#identify";renderGrid(match(ch.dataset.q));const m=match(ch.dataset.q);if(m[0])showDetail(m[0].id);return}
const tb=e.target.closest("[data-tab]");if(tb){$$("[data-tab]").forEach(b=>b.setAttribute("aria-pressed",b===tb));["dep","req","kab"].forEach(k=>$("#tab-"+k).hidden=k!==tb.dataset.tab);return}
const c=e.target.closest("[data-col]");if(c){collect(c.dataset.col)}});
$("#homeSearch").onsubmit=e=>{e.preventDefault();const v=$("#hq").value;$("#q").value=v;location.hash="#identify";const m=match(v);renderGrid(m);$("#detail").innerHTML="";if(m.length===1)showDetail(m[0].id)};
$("#q").oninput=e=>{renderGrid(match(e.target.value));$("#detail").innerHTML=""};
$("#photo").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const m=match(f.name.replace(/\.\w+$/,"").replace(/[_-]/g," ")),ok=m.length&&m.length<ITEMS.length;$("#pvBox").innerHTML=`<p><img class="pv" src="${r.result}" alt=""></p><p class="mute">${ok?t("suggest"):t("noSug")}</p>`;renderGrid(ok?m:ITEMS);if(ok)showDetail(m[0].id)};r.readAsDataURL(f)};
$("#depForm").onsubmit=async e=>{e.preventDefault();if(!need())return;const f=new FormData(e.target);try{await api("/deposits",{item:f.get("item"),qty:+f.get("qty")});await refresh();toast(t("saved"))}catch(x){fail(x)}};
$("#reqForm").onsubmit=async e=>{e.preventDefault();if(!need())return;const f=new FormData(e.target),form=e.target;try{await api("/requests",{item:f.get("item"),qty:+f.get("qty"),addr:f.get("addr"),date:f.get("date")});form.reset();await refresh();toast(t("saved"))}catch(x){fail(x)}};
$("#socForm").onsubmit=async e=>{e.preventDefault();if(!need())return;const f=new FormData(e.target);try{await api("/society",{name:f.get("name"),loc:f.get("loc"),box:f.get("box")},"PUT");await refresh();toast(t("saved"))}catch(x){fail(x)}};
$("#fbForm").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),form=e.target;try{await api("/feedback",{message:f.get("m")});form.reset();toast(t("thanks"))}catch(x){fail(x)}};
$("#authForm").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),form=e.target;try{await api("/auth",{name:f.get("name"),role:f.get("role"),pass:f.get("pass")});$("#dlg").close();form.reset();await refresh();toast(t("saved"))}catch(x){fail(x)}};
$("#dx").onclick=()=>$("#dlg").close();
$("#acct").onclick=async()=>{if(S.user){try{await api("/logout",{})}catch(x){}S.user=null;S.deps=[];S.reqs=[];S.all=[];S.soc=null;applyLang();refresh()}else openAuth()};
$("#lang").onclick=()=>{S.lang=S.lang==="en"?"hi":"en";saveLang();applyLang()};
addEventListener("hashchange",route);applyLang();route();refresh();
</script>
</body>
</html>
